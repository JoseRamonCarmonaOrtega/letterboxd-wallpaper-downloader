name: Build and Auto-Release Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name="LetterboxdWallpaperDownloader" gui_app.py

      - name: Publish Automatic Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release (Automatic Build)"
          body: "This is the latest compiled version of Letterboxd Wallpaper Downloader for Windows."
          files: dist/LetterboxdWallpaperDownloader.exe
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
