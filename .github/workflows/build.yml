name: Build and Auto-Release Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --noconsole --name="LetterboxdWallpaperDownloader-Windows" gui_app.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/LetterboxdWallpaperDownloader-Windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux Executable
        run: |
          pyinstaller --onefile --noconsole --name="LetterboxdWallpaperDownloader-Linux" gui_app.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/LetterboxdWallpaperDownloader-Linux

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: dist/

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist/

      - name: Publish Automatic Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release (Automatic Build)"
          body: "Automatically compiled binaries for Windows (.exe) and Linux."
          files: |
            dist/LetterboxdWallpaperDownloader-Windows.exe
            dist/LetterboxdWallpaperDownloader-Linux
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
